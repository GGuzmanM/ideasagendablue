<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Membresías vendidas por paciente · Propuesta (tarjetas)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet" />
  <script>
    tailwind.config = { theme: { extend: {
      colors: { primary:'#0044ab', surface:'#f7f9fb', 'surface-container-lowest':'#ffffff', 'surface-container-low':'#f2f4f6',
        'surface-container':'#eceef0', 'surface-container-high':'#e6e8ea', 'on-surface':'#191c1e', 'on-surface-variant':'#464555', 'outline-variant':'#c7c4d8' },
      fontFamily: { sans:['Inter','system-ui','sans-serif'] },
    } } };
  </script>
  <style>
    body { font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    .material-symbols-outlined { font-variation-settings:'FILL' 0; vertical-align:middle; }
    .msf { font-variation-settings:'FILL' 1; }
    .input { display:block; width:100%; padding:9px 12px; border-radius:12px; border:1px solid #cbd5e1; background:#fff; font-size:14px; outline:none; }
    .input:focus { border-color:#0044ab; box-shadow:0 0 0 2px rgba(0,68,171,.15); }
  </style>
</head>
<body class="bg-surface min-h-screen">

<!-- Header -->
<header class="px-8 py-5 bg-surface-container-lowest border-b border-outline-variant/30 flex items-center gap-4">
  <button class="w-9 h-9 rounded-xl grid place-items-center text-on-surface-variant hover:bg-surface-container"><span class="material-symbols-outlined">arrow_back</span></button>
  <div class="w-11 h-11 rounded-xl bg-primary/10 grid place-items-center"><span class="material-symbols-outlined msf text-primary text-2xl">card_membership</span></div>
  <div><h1 class="text-xl font-bold text-on-surface tracking-tight">Membresías</h1><p class="text-sm text-on-surface-variant">Editar una plantilla NO altera las ya vendidas</p></div>
  <div class="ml-2 inline-flex items-center bg-surface-container rounded-xl p-1 text-sm font-semibold">
    <button class="px-3.5 py-1.5 rounded-lg text-on-surface-variant">Plantillas</button>
    <button class="px-3.5 py-1.5 rounded-lg bg-surface-container-lowest text-on-surface shadow-sm">Vendidas por paciente</button>
  </div>
</header>

<div class="max-w-[1000px] mx-auto px-8 py-6">

  <!-- Resumen -->
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5">
    <div class="bg-surface-container-lowest border border-outline-variant/30 rounded-2xl p-4"><p class="text-xs font-semibold text-on-surface-variant/70 uppercase tracking-wide">Vendidas</p><p class="text-2xl font-extrabold text-on-surface mt-1">128</p></div>
    <div class="bg-surface-container-lowest border border-outline-variant/30 rounded-2xl p-4"><p class="text-xs font-semibold text-on-surface-variant/70 uppercase tracking-wide">Activas</p><p class="text-2xl font-extrabold text-emerald-600 mt-1">94</p></div>
    <div class="bg-surface-container-lowest border border-outline-variant/30 rounded-2xl p-4"><p class="text-xs font-semibold text-on-surface-variant/70 uppercase tracking-wide">Vencidas</p><p class="text-2xl font-extrabold text-amber-600 mt-1">22</p></div>
    <div class="bg-surface-container-lowest border border-outline-variant/30 rounded-2xl p-4"><p class="text-xs font-semibold text-on-surface-variant/70 uppercase tracking-wide">Anuladas</p><p class="text-2xl font-extrabold text-red-600 mt-1">12</p></div>
  </div>

  <!-- Filtros -->
  <div class="flex flex-wrap items-center gap-2 mb-4">
    <div class="relative flex-1 min-w-[240px]">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-lg">search</span>
      <input class="input pl-10" placeholder="Buscar paciente por nombre o DNI…" />
    </div>
    <div class="inline-flex items-center bg-surface-container rounded-xl p-1 text-sm font-semibold">
      <button class="px-3 py-1.5 rounded-lg bg-surface-container-lowest text-on-surface shadow-sm">Todas</button>
      <button class="px-3 py-1.5 rounded-lg text-on-surface-variant">Activas</button>
      <button class="px-3 py-1.5 rounded-lg text-on-surface-variant">Vencidas</button>
      <button class="px-3 py-1.5 rounded-lg text-on-surface-variant">Anuladas</button>
    </div>
  </div>

  <!-- Tarjetas -->
  <div id="lista" class="space-y-3"></div>

</div>

<script>
  const ESTADO = {
    ACTIVO:   { txt:'Activa',   cls:'text-emerald-700 bg-emerald-50 border-emerald-200', dot:'bg-emerald-500', ico:'check_circle' },
    VENCIDO:  { txt:'Vencida',  cls:'text-amber-700 bg-amber-50 border-amber-200',       dot:'bg-amber-500',   ico:'schedule' },
    AGOTADO:  { txt:'Agotada',  cls:'text-slate-600 bg-slate-100 border-slate-200',      dot:'bg-slate-400',   ico:'inventory_2' },
    ANULADO:  { txt:'Anulada',  cls:'text-red-700 bg-red-50 border-red-200',             dot:'bg-red-500',     ico:'block' },
  };
  const AVATAR = ['#0044ab','#7c3aed','#0891b2','#db2777','#ea580c','#059669'];
  const ini = (n) => n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  const col = (n) => AVATAR[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%AVATAR.length];

  const DATA = [
    { paciente:'Carlos Gustavo Guzmán Mori', dni:'75010274', sede:'Los Olivos', membresia:'Membresía Max', estado:'ACTIVO', usadas:2, total:6, ini:'07/08/2026', fin:'07/08/2027', contrato:true },
    { paciente:'María García Lara', dni:'70123456', sede:'One', membresia:'Membresía Oro', estado:'ACTIVO', usadas:5, total:12, ini:'01/07/2026', fin:'01/07/2027', contrato:true },
    { paciente:'Roberto Pérez Mamani', dni:'40556677', sede:'Paz Soldán', membresia:'Membresía Plata', estado:'VENCIDO', usadas:8, total:8, ini:'10/01/2026', fin:'10/07/2026', contrato:true },
    { paciente:'Lucía Mendoza Paz', dni:'44112233', sede:'Lince', membresia:'Membresía Max', estado:'ANULADO', usadas:0, total:6, ini:'05/08/2026', fin:'05/08/2027', contrato:false },
  ];

  function barra(usadas, total, estado) {
    const pct = total ? Math.round((usadas/total)*100) : 0;
    const color = estado==='ANULADO' ? 'bg-red-300' : estado==='VENCIDO' ? 'bg-amber-400' : 'bg-primary';
    return `<div class="w-full h-2 rounded-full bg-surface-container overflow-hidden"><div class="h-full ${color} rounded-full" style="width:${pct}%"></div></div>`;
  }

  function card(d) {
    const e = ESTADO[d.estado];
    const anulada = d.estado==='ANULADO';
    const restantes = d.total - d.usadas;
    return `
      <div class="bg-surface-container-lowest border border-outline-variant/30 rounded-2xl p-4 shadow-sm flex flex-col sm:flex-row sm:items-center gap-4 ${anulada?'opacity-70':''}">
        <!-- Paciente -->
        <div class="flex items-center gap-3 sm:w-56 shrink-0">
          <div class="w-11 h-11 rounded-full grid place-items-center text-white font-bold text-sm shrink-0" style="background:${col(d.paciente)}">${ini(d.paciente)}</div>
          <div class="min-w-0">
            <p class="font-bold text-on-surface leading-tight truncate">${d.paciente}</p>
            <p class="text-[11px] text-on-surface-variant/70">DNI ${d.dni} · ${d.sede}</p>
          </div>
        </div>

        <!-- Membresía + saldo -->
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1.5">
            <span class="material-symbols-outlined text-primary text-lg msf">workspace_premium</span>
            <span class="font-bold text-on-surface">${d.membresia}</span>
            <span class="text-[11px] font-bold px-2 py-0.5 rounded-full border ${e.cls} inline-flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full ${e.dot}"></span>${e.txt}</span>
          </div>
          <div class="flex items-center gap-3">
            <div class="flex-1">${barra(d.usadas, d.total, d.estado)}</div>
            <span class="text-[11px] font-semibold text-on-surface-variant whitespace-nowrap">${d.usadas}/${d.total} · <b class="text-on-surface">${restantes} disp.</b></span>
          </div>
          <p class="text-[11px] text-on-surface-variant/70 mt-1.5 flex items-center gap-1"><span class="material-symbols-outlined text-sm">event</span> Vigencia: ${d.ini} → ${d.fin}</p>
        </div>

        <!-- Acciones -->
        <div class="flex items-center gap-1.5 shrink-0">
          ${d.contrato ? `
            <button title="Ver contrato" class="w-9 h-9 grid place-items-center rounded-xl border border-outline-variant/50 text-on-surface-variant hover:bg-surface-container transition"><span class="material-symbols-outlined text-lg">visibility</span></button>
            <button title="Reimprimir contrato" class="w-9 h-9 grid place-items-center rounded-xl border border-primary/30 text-primary hover:bg-primary/5 transition"><span class="material-symbols-outlined text-lg">print</span></button>
          ` : `<span class="text-[10px] text-on-surface-variant/40 italic px-1">sin contrato</span>`}
          ${anulada
            ? `<button class="text-xs font-semibold text-emerald-700 border border-emerald-200 rounded-xl px-3 py-2 hover:bg-emerald-50 transition">Habilitar</button>`
            : `<button class="text-xs font-semibold text-red-600 border border-red-200 rounded-xl px-3 py-2 hover:bg-red-50 transition">Deshabilitar</button>`}
        </div>
      </div>`;
  }

  document.getElementById('lista').innerHTML = DATA.map(card).join('');
</script>
</body>
</html>
